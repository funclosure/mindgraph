<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mindgraph</title>
    <link rel="icon" type="image/svg+xml" href="/assets/mindgraph-icon.svg" />
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar" id="topbar"></header>
      <div class="graph-cell">
        <canvas id="stage"></canvas>
        <div id="graph-focus" class="graph-focus"></div>
        <div id="digest-inspector"></div>
        <div id="graph-empty" class="graph-empty" hidden></div>
      </div>
      <div class="strip" id="overview-strip"></div>
      <aside class="prose" id="prose">
        <section class="prose-pane prose-pane--source">
          <div class="prose-pane__head">Source</div>
          <div id="source-switcher" class="source-switcher"></div>
          <div id="source-reference" class="source-reference"></div>
          <div class="prose-view" id="prose-source"></div>
        </section>
        <section class="prose-pane prose-pane--ask">
          <div class="prose-pane__head">Ask</div>
          <div class="prose-view" id="prose-ask"></div>
        </section>
      </aside>
    </div>
    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
