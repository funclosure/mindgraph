<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mindgraph</title>
    <link rel="icon" type="image/svg+xml" href="/assets/mindgraph-icon.svg" />
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar" id="topbar"></header>
      <div class="graph-cell">
        <canvas id="stage"></canvas>
        <div id="graph-focus" class="graph-focus"></div>
        <div id="digest-inspector"></div>
      </div>
      <div class="strip" id="overview-strip"></div>
      <aside class="prose" id="prose">
        <div class="prose-tabs" role="tablist">
          <button class="prose-tab is-active" id="tab-source" role="tab" data-tab="source">Source</button>
          <button class="prose-tab" id="tab-ask" role="tab" data-tab="ask">Ask</button>
        </div>
        <div id="source-switcher" class="source-switcher"></div>
        <div class="prose-view" id="prose-source"></div>
        <div class="prose-view is-hidden" id="prose-ask"></div>
      </aside>
    </div>
    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
